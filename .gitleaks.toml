# gitleaks config for this repo.
# Extends the default ruleset and adds rules for the specific things that must
# never be committed here: real Tailscale CGNAT IPs and real *.ts.net tailnet
# hostnames. The documented placeholders are allowlisted below.

[extend]
useDefault = true

[[rules]]
id = "tailscale-cgnat-ip"
description = "Tailscale CGNAT IP (100.64/10 range)"
regex = '''100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}'''
tags = ["tailscale", "ip"]

[[rules]]
id = "tailnet-tsnet-host"
description = "Real Tailscale MagicDNS hostname (*.ts.net)"
regex = '''[a-z0-9][a-z0-9-]*\.[a-z0-9-]+\.ts\.net'''
tags = ["tailscale", "hostname"]

[allowlist]
description = "Documented placeholders used throughout the guide"
paths = [
  '''\.gitleaks\.toml''',
]
regexes = [
  '''your-host\.your-tailnet\.ts\.net''',
  '''your-tailnet''',
  '''CHANGE_ME_STRONG_PASSWORD''',
  '''NEW_PASSWORD''',
]
